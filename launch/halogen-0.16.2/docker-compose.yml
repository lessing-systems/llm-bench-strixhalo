# halogen-flash-server 0.16.2 for benchmarking, beside (never together with) a stock halogen setup.
# Same settings as the stock 0.15.0 docker-compose.yml we benchmarked as baseline; only the image tag differs.
# Checkpoints are unchanged between 0.15 and 0.16 (CHANGELOG), so it reads the same read-only weights.
#   sudo docker compose -p halogen-bench -f docker-compose.yml up -d     # API on :8732
#   sudo docker compose -p halogen-bench -f docker-compose.yml down
services:
  engine:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.16.2
    command: ["engine"]
    environment:
      HALOGEN_CTX: "131072"
      HALOGEN_KV_POOL_POSITIONS: "131072"
      HALOGEN_KV_SLOTS: "1"
      HALOGEN_MAX_TOK: "16384"
      HALOGEN_HOST_RESERVE_GIB: "28"
      HALOGEN_CACHE_BRANCHES: "3"
      HALOGEN_MAX_TOKENS_DEFAULT: "8192"
      HALOGEN_MAX_TOKENS_CAP: "16384"
      HALOGEN_PROMPT_CACHE: "2"
      HALOGEN_COMPOSABLE_CONTEXT: "0"
      HALOGEN_WEIGHTS_LOCK: "1"
      HALOGEN_ENGINE_WATCHDOG_S: "0"
      HALOGEN_VERBOSE: "1"
      HALOGEN_BIND: 0.0.0.0
      HALOGEN_VISION_TOWER: ""
    volumes:
      - ${MODELS_DIR:-${HOME}/models}/halogen-qwen38-flash-next:/models:ro
    devices: [/dev/kfd, /dev/dri]
    ipc: host
    ulimits:
      memlock: -1
    group_add: ["44", "992"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/halogen-healthcheck", "engine"]
      interval: 10s
      timeout: 35s
      retries: 3
      start_period: 20m
    stop_grace_period: 60s
    restart: "no"
    security_opt: [seccomp=unconfined]
  api:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.16.2
    command: ["api"]
    depends_on:
      engine:
        condition: service_healthy
    environment:
      HALOGEN_ENGINE: engine:8730
    volumes:
      - ${MODELS_DIR:-${HOME}/models}/halogen-qwen38-flash-next:/models:ro
    ports:
      - "8732:8731"
    healthcheck:
      test: ["CMD", "/usr/local/bin/halogen-healthcheck", "api"]
      interval: 10s
      timeout: 35s
      retries: 3
      start_period: 2m
    restart: "no"
    security_opt: [seccomp=unconfined]
